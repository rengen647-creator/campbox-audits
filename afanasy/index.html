<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F7F3">
<title>Афанасий — аудит Ордино и Весьегонска</title>
<style>
html,body{margin:0;min-height:100%;background:#F5F7F3;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
#cb-load{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;color:#355064;font:600 14px/1.5 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
#cb-load.err{color:#A93832}
</style>
</head>
<body>
<div id="cb-load">Загружаем аудит…</div>
<script>
(async function(){
 const parts=["parts/part-001.txt","parts/part-002.txt","parts/part-003.txt","parts/part-004.txt","parts/part-005.txt","parts/part-006.txt","parts/part-007.txt","parts/part-008.txt","parts/part-009.txt","parts/part-010.txt","parts/part-011.txt","parts/part-012.txt","parts/part-013.txt","parts/part-014.txt","parts/part-015.txt","parts/part-016.txt","parts/part-017.txt","parts/part-018.txt","parts/part-019.txt","parts/part-020.txt","parts/part-021.txt","parts/part-022.txt","parts/part-023.txt","parts/part-024.txt","parts/part-025.txt"];
 const token=new URLSearchParams(location.search).get('cb')||Date.now();
 try{
   const rows=await Promise.all(parts.map(function(p){
     return fetch(p+'?v='+encodeURIComponent(token),{cache:'no-store'}).then(function(r){
       if(!r.ok) throw new Error(p+' HTTP '+r.status);
       return r.text();
     });
   }));
   document.open();
   document.write(rows.join(''));
   document.close();
 }catch(e){
   var el=document.getElementById('cb-load');
   if(el){el.className='err';el.textContent='Не удалось загрузить аудит. Обновите страницу.';}
   console.error('CampBox Afanasy loader:',e);
 }
})();
</script>
</body>
</html>
