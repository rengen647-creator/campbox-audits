<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CampBox — коммерческое предложение</title>
<style>html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#fffaf3;color:#1a3d2f}.load{max-width:500px;margin:22vh auto;padding:24px;text-align:center}.load strong{font-size:32px;display:block}.load p{line-height:1.6;color:#5c715f}.spin{width:34px;height:34px;border:4px solid #dce7dc;border-top-color:#17674e;border-radius:50%;animation:spin 1s linear infinite;margin:25px auto}@keyframes spin{to{transform:rotate(360deg)}}button{padding:12px 20px;border:0;border-radius:9px;background:#17674e;color:white;font-weight:bold;cursor:pointer}</style>
</head><body><div class="load" id="loading"><strong>CampBox</strong><p>Открываем коммерческое предложение…</p><div class="spin" aria-label="Загрузка"></div></div>
<script>
(async function(){
 try{
  const urls=Array.from({length:13},(_,i)=>'chunks/'+String(i).padStart(2,'0')+'.txt');
  const parts=await Promise.all(urls.map(async u=>{
   const response=await fetch(u);
   if(!response.ok)throw Error('Не удалось загрузить '+u+': '+response.status);
   return response.text();
  }));
  const html=parts.join('');
  if(html.length!==5382056 || !html.startsWith('<!DOCTYPE html>'))throw Error('Неполная загрузка HTML');
  document.open(); document.write(html); document.close();
 }catch(error){
  const node=document.getElementById('loading');
  if(node)node.innerHTML='<strong>CampBox</strong><p>Не удалось загрузить КП. Проверьте подключение к интернету.</p><button type="button" onclick="location.reload()">Повторить</button>';
  console.error('CampBox loading:',error);
 }
})();
</script></body></html>
