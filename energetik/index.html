<script>(async()=>{try{const s=window.__CB_AUDIT||"";const b=Uint8Array.from(atob(s),c=>c.charCodeAt(0));const ds=new DecompressionStream("gzip");const t=await new Response(new Blob([b]).stream().pipeThrough(ds)).text();document.open();document.write(t);document.close()}catch(e){document.getElementById("load").textContent="Ошибка загрузки аудита";console.error(e)}})();</script></body></html>
