<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CampBox × ДОЛ «Юность» / «Перекоп»</title></head><body><div style="min-height:90vh;display:grid;place-items:center;font:16px system-ui;color:#354c40">Загружаем персональное предложение CampBox…</div><script>(async()=>{try{const files=Array.from({length:18},(_,i)=>'./payload/'+String(i+1).padStart(2,'0')+'.txt');const parts=await Promise.all(files.map(async u=>{const r=await fetch(u,{cache:'no-cache'});if(!r.ok)throw new Error(u+': '+r.status);return r.text()}));const html=parts.join('');if(html.length!==6939442||!html.includes('campbox-tilda-height-bridge'))throw new Error('Не загружен полный HTML');document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div style="padding:36px;font:18px system-ui">Не удалось загрузить предложение. Попробуйте обновить страницу.</div>';console.error('CampBox offer load error',e)}})();</script></body></html>
