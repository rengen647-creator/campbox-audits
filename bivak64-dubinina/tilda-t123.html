  ></iframe>
</div>
<script>
(function(){
  'use strict';
  var frame=document.getElementById('cb-bivak64-frame');
  if(!frame)return;
  var trustedOrigin='https://rengen647-creator.github.io';
  function resize(event){
    if(event.origin!==trustedOrigin || event.source!==frame.contentWindow)return;
    var data=event.data;
    if(!data || data.type!=='campbox-audit-height' || data.slug!=='bivak64-dubinina')return;
    var n=Number(data.height);
    if(!Number.isFinite(n))return;
    var newHeight=Math.min(30000,Math.max(900,Math.ceil(n)+8));
    if(Math.abs(frame.offsetHeight-newHeight)>4)frame.style.height=newHeight+'px';
  }
  window.addEventListener('message',resize,false);
})();
</script>
