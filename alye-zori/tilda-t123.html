<style>
  #campbox-alye-zori-embed{position:relative;left:50%;transform:translateX(-50%);width:calc(100vw - 2px);max-width:calc(100vw - 2px);margin:0;padding:0;overflow:hidden;background:#f7faf6}
  #campbox-alye-zori-frame{display:block;max-width:100%;width:100%;border:0}
</style>
<script>
(function(){
  'use strict';
  var frame=document.getElementById('campbox-alye-zori-frame');
  var wrap=document.getElementById('campbox-alye-zori-embed');
  if(!frame||!wrap)return;
  var trustedOrigin='https://rengen647-creator.github.io';
  window.addEventListener('message',function(event){
    if(event.origin!==trustedOrigin||event.source!==frame.contentWindow)return;
    var data=event.data;
    if(!data||data.slug!=='alye-zori')return;
    if(data.type==='campbox-alye-zori-height'){
      var h=Number(data.height);
      if(!Number.isFinite(h)||h<300||h>60000)return;
      var next=Math.ceil(h)+5;
      var current=parseInt(frame.style.height,10)||0;
      if(Math.abs(next-current)>3)frame.style.height=next+'px';
    }
    if(data.type==='campbox-alye-zori-navigate'){
      var y=wrap.getBoundingClientRect().top+window.scrollY;
      window.scrollTo({top:Math.max(0,y),behavior:'instant'});
    }
  },false);
})();
</script>
