<script>(async()=>{try{const s=window.__CB_AUDIT||"";const b=Uint8Array.from(atob(s),c=>c.charCodeAt(0));const ds=new DecompressionStream("gzip");let t=await new Response(new Blob([b]).stream().pipeThrough(ds)).text();const bridge='<script>(function(){function send(){var h=Math.max(document.documentElement.scrollHeight,document.body?document.body.scrollHeight:0);parent.postMessage({type:"campbox-audit-height",slug:"burevestnik",height:h},"*");}window.addEventListener("load",send);window.addEventListener("resize",send);new ResizeObserver(send).observe(document.documentElement);setTimeout(send,300);setTimeout(send,1200);})();<\/script>';t=t.replace(/<\/body>/i,bridge+'</body>');document.open();document.write(t);document.close()}catch(e){document.getElementById("load").textContent="Ошибка загрузки аудита";console.error(e)}})();</script></body></html>
